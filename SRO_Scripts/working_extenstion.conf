[globals]
;group 0 will be used for incoming calls
#EXOIN = DAHDI/g0
;Temporarily in dev, we use SIP
;EXOIN=SIP
;group 11 for outgoing
#EXOOUT = DAHDI/G11
;EXOOUT=SIP
;This will be used by adhearsion
#EXOCID=8030752400

[general]
autofallthrough = yes ;really?
clearglobalvars = no

[incoming]

;Send everything to adhearsion
exten => _X.,1,Ringing
; Block this guy. He is randomly making call to tollfree numbers.
exten => _X.,2,GotoIf($["${CALLERID(num)}" =~ "9179449865"]?hangup)
exten => _X.,n,GotoIf($["${CALLERID(num)}" = "79449865"]?hangup)
exten => _X.,n,Set(CDR(accountcode)=${EXTEN})
exten => _X.,n,Set(TIMEOUT(absolute)=14520)
exten => _X.,n,Set(DYNAMIC_FEATURES=nway-start)
exten => _X.,n,Set(__PARENTCALLSID=${UNIQUEID})
exten => _X.,n,Set(CALLERID(name-valid)=no)
exten => _X.,n,AGI(agi://127.0.0.1)
exten => _X.,n(hangup),Hangup()

;JIO-SIP accepts numbers with only +91 extension. So adding separate rules for JIO.The same rule applied for BSNL SIP
exten => _[+0-9].,1,Ringing
exten => _[+0-9].,2,Set(CDR(accountcode)=${EXTEN}) ;Is this really needed?
exten => _[+0-9].,n,Set(TIMEOUT(absolute)=14520)
exten => _[+0-9].,n,Set(DYNAMIC_FEATURES=nway-start)
exten => _[+0-9].,n,Set(__PARENTCALLSID=${UNIQUEID})
exten => _[+0-9].,n,Set(CALLERID(name-valid)=no)
exten => _[+0-9].,n,AGI(agi://127.0.0.1)
exten => _[+0-9].,n(hangup),Hangup()

[conf]
exten => 1,1,AGI(agi://127.0.0.1)
exten => 2,1,AGI(agi://127.0.0.1)

[macro-trigger-conf]
;; Send the caller at extension = 1 to differentiate this channel as the "marked channel"
;; Marked-channel is like the moderator for the channel - whenever (s)he exits, the conf will also exit
;; The others conference participants are sent to extension = 2
exten => s,1,GotoIf(${CONFACTIONURL}?continue:exit)
exten => s,n(continue),ChannelRedirect(${BRIDGEPEER},conf,1,1)
exten => s,n,Set(DYNAMIC_FEATURES=nway-inv#nway-noinv)
exten => s,n,AGI(agi://127.0.0.1)
exten => s,n,Set(DYNAMIC_FEATURES=)
exten => s,n,ChannelRedirect(${CHANNEL},conf,2,1)
exten => s,n(exit),NoOp()

[macro-conf-ok]
exten => s,1,ChannelRedirect(${BRIDGEPEER},conf,2,1)

[macro-conf-notok]
exten => s,1,SoftHangup(${BRIDGEPEER})

[outbound-dial]

;Extension for dialing for Exotel on SIP phones
; Please register your SIP with asterisk using the same number as your mobile number
exten => 9999,1,Dial(${DIALSTRING})

;Send everything else to adhearsion
; if skip_ringing is set, skipping ringing and playing silence
exten => _X.,1,GotoIf($[ ${skip_ringing} = 1 ]?skipRinging:continue)
exten => _X.,n(continue),Ringing
exten => _X.,n(skipRinging),Set(CDR(accountcode)=${EXTEN})
exten => _X.,n,Set(TIMEOUT(absolute)=14520)
exten => _X.,n,AGI(agi://127.0.0.1)

