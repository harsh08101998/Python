[iax_conf_incoming]
exten => _.,1,NoOp()
exten => _.,n,AGI(agi://127.0.0.1)

[listen]
exten => _.,1,NoOp()
exten => _.,n,ChanSpy(${MONITOREDCHAN_},qsdE)

[barge]
exten => _.,1,NoOp()
exten => _.,n,ChanSpy(${MONITOREDCHAN_},qsdEB)

[whisper]
exten => _.,1,NoOp()
exten => _.,n,ChanSpy(${MONITOREDCHAN_},qsdEw)

[internalstream]
exten => _3XXX,1,NoOp()
exten => _3XXX,n,Answer
exten => _3XXX,n,ChanSpy(${STREAM_},qBE)
exten => _3XXX,n,Hangup()

[remotestream]
exten => _2XXX.,1,NoOp()
exten => _2XXX.,n,Dial(SIP/${CUT(EXTEN,,2)}/${CUT(EXTEN,,1)})
exten => _2XXX.,n,Hangup()